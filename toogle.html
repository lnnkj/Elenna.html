<!DOCTYPE html>
<html>
<body>

<h2>What Can JavaScript Do?</h2>

<p>JavaScript can change HTML attribute values.</p>

<p>In this case JavaScript changes the value of the src (source) attribute of an image.</p>

<button onclick="document.getElementById('myImage').src='Images/toggleon.jpg'">Turn on the toggle</button>

<img id="myImage" src="Images/toggleoff.jpg" style="width:100px">

<button onclick="document.getElementById('myImage').src='Images/toggleoff.jpg'">Turn off the toggle</button>

</body>
</html>
